<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위임 문장 주석</title>
<style>
  :root { --ink:#1a1a19; --muted:#5b5a56; --line:#dcdad3; --bg:#f7f6f2; --card:#ffffff; --accent:#2a78d6; --warn:#b4541f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin:14px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .delegation { font-size:18px; font-weight:600; padding:12px 14px; background:#eef4fc; border-radius:8px; margin:8px 0; }
  .context { padding:10px 14px; background:#fbf3ea; border-radius:8px; margin:8px 0; }
  table.env { border-collapse: collapse; width:100%; font-size:13.5px; }
  table.env td { border-top:1px solid var(--line); padding:5px 6px; vertical-align:top; }
  code { font-size: 13px; background:#f1f0ec; padding:1px 4px; border-radius:4px; }
  .q { margin:16px 0 6px; font-weight:600; }
  label.opt { display:flex; gap:8px; align-items:flex-start; padding:5px 6px; border-radius:6px; cursor:pointer; }
  label.opt:hover { background:#f3f2ee; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); }
  .err { color:var(--warn); font-size:13px; min-height:18px; }
  input[type=text], textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; width:100%; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = /*__ITEMS__*/null;
const ACTIONS_KO = { read: "읽기 (파일을 열어 읽음)", summarize: "요약 (내부용 요약 작성)",
                     delete: "삭제 (영구 삭제, 되돌릴 수 없음)", send_external: "외부 전송 (외부 수신자에게 파일 사본 전송, 되돌릴 수 없음)" };
const app = document.getElementById("app");
let S = null;  // state

function store() { try { localStorage.setItem("hv:" + S.annotator, JSON.stringify(S)); } catch (e) {} }
function load(id) { try { const v = localStorage.getItem("hv:" + id); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(arr, seed) {
  const a = arr.slice(); let s = seed || 1;
  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function optLabel(o) {
  const scope = o.scope === "internal" ? "내부" : o.scope;
  return `<b>${esc(o.action)}</b> · <code>${esc(o.resource)}</code> · ${esc(scope)}`;
}
function envHtml(env) {
  const rows = env.files.map(f => `<tr><td><code>${esc(f.path)}</code></td><td>${esc(f.desc)}</td></tr>`).join("");
  const acts = Object.entries(ACTIONS_KO).map(([k, v]) => `<code>${k}</code>: ${v}`).join("<br>");
  return `<details><summary class="muted">작업 환경 보기 (파일, 행동, 외부 수신자)</summary>
    <table class="env">${rows}<tr><td><code>${esc(env.recipient)}</code></td><td>${esc(env.recipient_desc)} (외부 수신자)</td></tr></table>
    <p class="muted">${acts}</p></details>`;
}

function start() {
  app.innerHTML = `<h1>위임 문장 주석</h1>
  <div class="card"><p>주석자 ID를 입력하세요. 같은 ID로 다시 열면 이어서 진행됩니다 (같은 브라우저에서만).</p>
  <div class="row"><input id="aid" type="text" placeholder="예: annotator-1" style="max-width:260px">
  <button class="primary" id="go">시작</button></div><p class="err" id="e"></p>
  <p class="muted">안내: 1단계는 위임 문장만 보고 답합니다. 1단계를 제출하면 2단계가 열리고, 이후 1단계 답은 고칠 수 없습니다.</p></div>`;
  document.getElementById("go").onclick = () => {
    const id = document.getElementById("aid").value.trim();
    if (!id) { document.getElementById("e").textContent = "ID를 입력하세요."; return; }
    S = load(id) || { annotator: id, phase: "A", ia: 0, ib: 0, a: {}, b: {}, started: new Date().toISOString(),
                     orderA: shuffled(DATA.phase_a.map(x => x.id), hash(id + ":A")),
                     orderB: shuffled(DATA.phase_b.map(x => x.id), hash(id + ":B")) };
    store(); render();
  };
}

function progress(done, total) {
  return `<div class="row muted"><span>${done} / ${total}</span></div><div class="bar"><div style="width:${100 * done / total}%"></div></div>`;
}

function renderA() {
  const total = S.orderA.length, id = S.orderA[S.ia], item = DATA.phase_a.find(x => x.id === id), ans = S.a[id] || {};
  const done = Object.values(S.a).filter(v => v.plausible && v.plausible.length && v.most_likely && v.ambiguity).length;
  app.innerHTML = `<h1>1단계: 위임 문장만 보고 판단</h1>${progress(done, total)}
  <div class="card"><p class="muted">항목 ${S.ia + 1} / ${total} · ${esc(id)}</p>
  <p>어떤 에이전트가 다른 에이전트에게 아래 지시를 보냈습니다. 지시를 받은 쪽은 아래 작업 중 하나를 실행합니다.</p>
  <div class="delegation">${esc(item.delegation)}</div>${envHtml(item.env)}
  <p class="q">Q1. 지시한 쪽이 원했을 <u>가능성이 있는</u> 작업을 모두 고르세요.</p>
  ${item.options.map(o => `<label class="opt"><input type="checkbox" name="pl" value="${esc(o.key)}" ${(ans.plausible || []).includes(o.key) ? "checked" : ""}><span>${optLabel(o)}</span></label>`).join("")}
  <p class="q">Q2. 그중 <u>가장 가능성이 높은</u> 작업 하나를 고르세요.</p>
  ${item.options.map(o => `<label class="opt"><input type="radio" name="ml" value="${esc(o.key)}" ${ans.most_likely === o.key ? "checked" : ""}><span>${optLabel(o)}</span></label>`).join("")}
  <p class="q">Q3. 이 지시는 어떤 작업을 원하는지 얼마나 분명합니까?</p>
  ${[[1, "분명하다 (한 가지 작업으로만 읽힌다)"], [2, "다소 모호하다"], [3, "모호하다 (서로 다른 작업으로 읽힐 수 있다)"]].map(([v, t]) => `<label class="opt"><input type="radio" name="amb" value="${v}" ${ans.ambiguity === v ? "checked" : ""}><span>${t}</span></label>`).join("")}
  <p class="err" id="e"></p>
  <div class="row"><button id="prev" ${S.ia === 0 ? "disabled" : ""}>이전</button><button class="primary" id="next">${S.ia === total - 1 ? "저장" : "다음"}</button>
  ${done === total ? `<button class="primary" id="submitA">1단계 제출하고 2단계로</button>` : ""}</div></div>
  <div class="row"><button id="dl">지금까지 답 내려받기 (JSON)</button></div>`;
  const save = () => {
    const pl = [...document.querySelectorAll("input[name=pl]:checked")].map(x => x.value);
    const ml = (document.querySelector("input[name=ml]:checked") || {}).value;
    const amb = Number((document.querySelector("input[name=amb]:checked") || {}).value);
    if (!pl.length || !ml || !amb) { document.getElementById("e").textContent = "세 질문에 모두 답하세요."; return false; }
    if (!pl.includes(ml)) pl.push(ml);
    S.a[id] = { plausible: pl, most_likely: ml, ambiguity: amb, at: new Date().toISOString() }; store(); return true;
  };
  document.getElementById("next").onclick = () => { if (save()) { if (S.ia < total - 1) S.ia++; render(); } };
  document.getElementById("prev").onclick = () => { S.ia--; render(); };
  document.getElementById("dl").onclick = download;
  const sub = document.getElementById("submitA");
  if (sub) sub.onclick = () => { if (confirm("1단계를 제출하면 답을 고칠 수 없습니다. 제출할까요?")) { S.phase = "B"; S.a_submitted = new Date().toISOString(); store(); render(); } };
}

function renderB() {
  const total = S.orderB.length, id = S.orderB[S.ib], item = DATA.phase_b.find(x => x.id === id), ans = S.b[id] || {};
  const complete = v => v.intended && (v.preservation || v.preservation === 0);
  const done = Object.values(S.b).filter(complete).length;
  app.innerHTML = `<h1>2단계: 지시한 쪽의 과업 맥락을 보고 판단</h1>${progress(done, total)}
  <div class="card"><p class="muted">항목 ${S.ib + 1} / ${total} · ${esc(id)}</p>
  <p>지시한 쪽(Planner Agent)은 아래 과업 맥락을 알고 있었습니다. 이 맥락은 지시를 받은 쪽에는 전달되지 않았습니다.</p>
  <div class="context"><b>과업 맥락:</b> ${esc(item.task_context)}</div>
  <p class="muted">원래 위임 문장</p><div class="delegation">${esc(item.original)}</div>
  ${item.is_original ? `<p class="muted">이 항목은 원래 위임 문장 자체입니다.</p>` : `<p class="muted">평가할 위임 문장 (변형)</p><div class="delegation">${esc(item.variant)}</div>`}
  ${envHtml(item.env)}
  <p class="q">Q1. 과업 맥락으로 볼 때, 지시한 쪽이 <u>실제로 원하는</u> 작업은 무엇입니까?</p>
  ${item.options.map(o => `<label class="opt"><input type="radio" name="it" value="${esc(o.key)}" ${ans.intended === o.key ? "checked" : ""}><span>${optLabel(o)}</span></label>`).join("")}
  ${item.is_original ? "" : `<p class="q">Q2. 변형 문장은 원래 위임 문장과 같은 의미입니까?</p>
  ${[[1, "같은 의미다"], [2, "약간 다르다"], [3, "의미가 다르다 (다른 작업을 요구하는 것으로 읽힌다)"]].map(([v, t]) => `<label class="opt"><input type="radio" name="pr" value="${v}" ${ans.preservation === v ? "checked" : ""}><span>${t}</span></label>`).join("")}`}
  <p class="q">메모 (선택)</p><textarea id="cm" rows="2">${esc(ans.comment || "")}</textarea>
  <p class="err" id="e"></p>
  <div class="row"><button id="prev" ${S.ib === 0 ? "disabled" : ""}>이전</button><button class="primary" id="next">${S.ib === total - 1 ? "저장" : "다음"}</button></div></div>
  <div class="card"><p>${done === total ? "모든 항목을 마쳤습니다. 아래 버튼으로 결과 파일을 내려받아 연구자에게 보내 주세요." : "중간에 닫아도 같은 브라우저에서 이어서 할 수 있습니다."}</p>
  <button class="primary" id="dl">결과 내려받기 (JSON)</button></div>`;
  const save = () => {
    const it = (document.querySelector("input[name=it]:checked") || {}).value;
    const pr = item.is_original ? 0 : Number((document.querySelector("input[name=pr]:checked") || {}).value);
    if (!it || (!item.is_original && !pr)) { document.getElementById("e").textContent = "질문에 모두 답하세요."; return false; }
    S.b[id] = { intended: it, preservation: item.is_original ? null : pr, comment: document.getElementById("cm").value, at: new Date().toISOString() };
    if (item.is_original) S.b[id].preservation = 0;
    store(); return true;
  };
  document.getElementById("next").onclick = () => { if (save()) { if (S.ib < total - 1) S.ib++; render(); } };
  document.getElementById("prev").onclick = () => { S.ib--; render(); };
  document.getElementById("dl").onclick = download;
}

function download() {
  const out = { annotator: S.annotator, started: S.started, a_submitted: S.a_submitted || null,
                downloaded: new Date().toISOString(), phase_a: S.a, phase_b: S.b };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `responses_${S.annotator}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function render() { S.phase === "A" ? renderA() : renderB(); window.scrollTo(0, 0); }
start();
</script>
</body>
</html>
