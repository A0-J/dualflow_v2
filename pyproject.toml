[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualflow-v2"
version = "0.1.0"
description = "Minimal paper-ready experiments for independent semantic and authority verification"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
